<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --surface: #ffffff;
  --surface-2: #faf9f6;
  --ink: #141416;
  --ink-2: #4d4d55;
  --ink-3: #7c7c86;
  --line: #e3e1da;
  --line-2: #d2cfc6;
  --muted-bg: #edece7;
  --ok: #17714a;
  --ok-bg: #e2f2e9;
  --warn: #9a5200;
  --warn-bg: #fcefdc;
  --bad: #b0262c;
  --bad-bg: #f9e3e2;
  --info: #2450a6;
  --info-bg: #e5ecfa;
  --star: #d99a00;
  --accent: #141416;
  --accent-ink: #ffffff;
  --focus: #2f5bea;
  --spec-size: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113;
    --surface: #1a1a1d;
    --surface-2: #202024;
    --ink: #f1f0ec;
    --ink-2: #b4b3ad;
    --ink-3: #85847f;
    --line: #2b2b30;
    --line-2: #3b3b41;
    --muted-bg: #26262a;
    --ok: #5cd193;
    --ok-bg: #163526;
    --warn: #f0a94b;
    --warn-bg: #3a2a12;
    --bad: #f37d81;
    --bad-bg: #3d1b1d;
    --info: #8db1ff;
    --info-bg: #1b2740;
    --star: #f2b630;
    --accent: #f1f0ec;
    --accent-ink: #111113;
    --focus: #7d9bff;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(1100px 480px at 50% -180px, color-mix(in srgb, var(--star) 14%, transparent), transparent 70%) no-repeat, var(--bg);
  color: var(--ink);
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.skyline { position: fixed; left: 0; right: 0; bottom: 0; height: clamp(170px, 30vh, 330px); z-index: -1; pointer-events: none; color: var(--ink); -webkit-mask-image: linear-gradient(to top, #000 62%, transparent); mask-image: linear-gradient(to top, #000 62%, transparent); }
.skyline svg { display: block; width: 100%; height: 100%; }
.wrap { max-width: 1480px; margin-inline: auto; padding-inline: 24px; }

/* Header */
.brand { display: flex; align-items: center; gap: 10px; margin: 0; flex: none; }
.brand { gap: 12px; }
.brand .mark { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; }
.brand svg { flex: none; width: 32px; height: 32px; }
.brand .wm { font: 700 17px/1 "Unbounded", "Golos Text", system-ui, sans-serif; letter-spacing: -.01em; }
.brand .dot { color: var(--ink-3); }
.brand .wm { letter-spacing: 0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.brand .sub { font-size: 15px; font-weight: 500; color: var(--ink-3); padding-left: 12px; border-left: 1px solid var(--line-2); letter-spacing: 0; }
h1 { font-size: 20px; line-height: 1.1; letter-spacing: -0.015em; margin: 0; font-weight: 700; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.lang { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 999px; }
.lang button { border: 0; background: transparent; height: 30px; min-width: 38px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--ink-3); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 15px;
  border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
  font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; text-decoration: none;
  transition: border-color .15s, background .15s, opacity .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { opacity: .88; }
.btn.small { height: 34px; padding: 0 14px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: progress; }

/* Toolbar */
.toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
@media (max-height: 760px), (max-width: 640px) { .toolbar { position: static; } }
.nav { display: flex; align-items: center; gap: 0 28px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; align-self: stretch; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; height: 58px; padding: 0 14px; font-weight: 600; font-size: 14px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab b { font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.tab .star-ic { color: var(--star); margin-right: 4px; }
.tb { padding-top: 12px; padding-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.tb-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sample { flex: 1 1 360px; min-width: 0; height: 46px; padding: 0 16px; font-size: 19px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-size: 13px; font-weight: 500; }
#pangramBtn span { color: var(--ink-3); }
#pangramBtn span.on { color: var(--ink); font-weight: 700; }
.presets button:hover { background: var(--surface); border-color: var(--ink-3); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 18px; background: var(--muted-bg); }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg button b { font-weight: 600; margin-left: 5px; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.seg button[aria-pressed="true"] b { color: inherit; }
.search { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); width: 170px; font-size: 14px; margin-left: auto; }
#catSeg b, #kindSeg b { display: none; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.chk input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
.range { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.range input { accent-color: var(--ink); width: 120px; }
.tb-status { display: flex; gap: 4px 16px; align-items: flex-start; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); min-height: 20px; }
.tb-status .spacer { flex: 1; }
.licnote { font-size: 13px; }
.licnote a, .lic-box .link { cursor: pointer; }
.licnote summary { cursor: pointer; list-style: none; color: var(--ink-2); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.licnote summary::-webkit-details-marker { display: none; }
.licnote summary::before { content: "i"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 10px; font-weight: 700; font-style: italic; font-family: Georgia, serif; }
.licnote summary:hover { color: var(--ink); }
.licnote p { margin: 6px 0 0; color: var(--ink-2); max-width: 72ch; }
.licnote a { font-weight: 600; }
#licSeg button[data-l]:not([data-l="all"])::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--ink-3); }
#licSeg button[data-l="ads"]::before { background: var(--ok) !important; }
#licSeg button[data-l="rights"]::before { background: var(--warn) !important; }
#licSeg button[data-l="personal"]::before { background: var(--bad) !important; }
.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; font-weight: 600; }

/* Intro + notes */
.intro { padding-top: 24px; padding-bottom: 48px; }
.intro-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(24px, 4vw, 48px); max-width: 1080px; margin-inline: auto; display: grid; gap: 28px 56px; align-items: center; }
@media (min-width: 880px) { .intro-card { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); } }
.intro-big { font-size: clamp(60px, 9vw, 116px); line-height: 1.15; margin: 0 0 12px !important; font-weight: 800; letter-spacing: -0.02em; color: var(--ink) !important; max-width: none !important; }
.intro-lede { font-size: 17px; line-height: 1.5; }
.intro-card p { color: var(--ink-2); margin: 0 0 12px; max-width: 62ch; }
.intro-card strong { color: var(--ink); }
.intro-card .btn { margin: 6px 0 18px; height: 40px; font-size: 14px; }
.privacy { display: flex; gap: 8px; align-items: flex-start; }
.privacy svg { flex: none; margin-top: 3px; color: var(--ok); }
code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .9em; background: var(--muted-bg); padding: 1px 6px; border-radius: 6px; }
.note { margin-top: 20px !important; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn) !important; font-weight: 500; }
.banner { margin-top: 20px; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.banner h2 { font-size: 17px; margin: 0; }
.banner p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* License guide */
.guide { padding: 4px 0 8px; }
.dlg-h { margin: 0 0 8px; padding-right: 48px; font-size: clamp(20px, 2.4vw, 26px); letter-spacing: -0.01em; }
.g-close { position: absolute; top: 16px; right: 16px; z-index: 1; }
#guideDlg { width: min(1040px, calc(100vw - 32px)); }
.guide h2 { padding-right: 48px; font-size: clamp(22px, 2.6vw, 30px); letter-spacing: -0.01em; margin: 0 0 8px; }
.guide .lead { color: var(--ink-2); font-size: 17px; margin: 0 0 24px; max-width: 64ch; }
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.rule h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.rule h3 span { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; font-size: 13px; }
.rule.ok h3 span { background: var(--ok-bg); color: var(--ok); }
.rule.info h3 span { background: var(--info-bg); color: var(--info); }
.rule.bad h3 span { background: var(--bad-bg); color: var(--bad); }
.rule p { margin: 0; color: var(--ink-2); font-size: 14px; }
.guide .sub-h { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 32px 0 6px; }
.guide p { max-width: 72ch; }
.guide .legend { color: var(--ink-2); font-size: 14px; margin: -8px 0 22px; line-height: 2; }
.guide .legend .lg { display: inline-block; white-space: nowrap; margin-right: 20px; }
.guide .legend .lic-dot { margin-right: 7px; vertical-align: 0; }
.guide .legend small { color: var(--ink-3); font-size: 13px; }
.guide .fine { color: var(--ink-3); font-size: 13px; margin-top: 24px; }

/* Grid + cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; padding-top: 20px; padding-bottom: 56px; }
.grid.list { grid-template-columns: 1fr; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px 12px 18px; display: flex; flex-direction: column; min-width: 0;
  content-visibility: auto; contain-intrinsic-size: auto 220px; transition: border-color .15s;
}
.card:hover { border-color: var(--line-2); }
.card-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name { border: 0; background: none; padding: 0; font-weight: 600; font-size: 14px; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.name:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.star { margin-left: auto; border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.star:hover { background: var(--muted-bg); color: var(--ink); }
.star path { fill: none; }
.star[aria-pressed="true"], .star[aria-pressed="true"]:hover { color: var(--star); }
.star[aria-pressed="true"] path { fill: currentColor; }
.spec {
  font-size: var(--spec-size); line-height: 1.18; margin: 10px 0 14px; flex: 1;
  overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.spec { transition: color .25s ease; position: relative; }
/* While the real font downloads: two soft bars where the text will be, instead of a flash of the default font */
.spec.pending { color: transparent !important; }
.spec.pending::before, .spec.pending::after { content: ""; position: absolute; left: 0; height: .62em; border-radius: 999px; background: var(--muted-bg); animation: specPulse 1.1s ease-in-out infinite alternate; }
.spec.pending::before { top: .12em; right: 18%; }
.spec.pending::after { top: 1.3em; right: 42%; animation-delay: .25s; }
@keyframes specPulse { from { opacity: .45; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .spec.pending::before, .spec.pending::after { animation: none; } }
.spec.click { cursor: pointer; }
.grid.list .spec { -webkit-line-clamp: 2; }
.spec.na, .ghost .spec, .spec.text { font-size: 15px; line-height: 1.5; color: var(--ink-3); -webkit-line-clamp: unset; }
.spec.text { color: var(--ink-2); }
.miss { color: var(--bad); text-decoration: underline wavy var(--bad); text-decoration-skip-ink: none; text-underline-offset: .15em; text-decoration-thickness: 2px; }
.card-f { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.badges { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; overflow: hidden; }
.fact { font-size: 12px; color: var(--ink-3); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.fact + .fact::before { content: "·"; margin: 0 6px; opacity: .6; }
.lic-dot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); cursor: help; }
.lic-dot.ok { background: var(--ok); }
.lic-dot.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--ok); }
.lic-dot.warn { background: var(--warn); }
.lic-dot.bad { background: var(--bad); }
.grid[data-view="lib"] .lic-dot { display: none; }
.card-h .lic-dot { margin-left: 2px; }
.badge { display: inline-block; height: 22px; line-height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--muted-bg); color: var(--ink-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.have { background: transparent; box-shadow: inset 0 0 0 1px var(--ok); color: var(--ok); }
.badge.lic-free { background: transparent; box-shadow: inset 0 0 0 1px var(--ok); color: var(--ok); }
.copy, .get { border: 0; background: none; font-size: 12px; color: var(--ink-3); padding: 4px 6px; border-radius: 6px; white-space: nowrap; flex: none; text-decoration: none; }
.copy:hover, .get:hover { color: var(--ink); background: var(--muted-bg); }
.get { color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line-2); padding: 4px 9px; }
/* Mogul fonts: the real name under the Mogul name, and the "what is it" box in the detail view */
.alias { margin: 1px 0 0; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alias b { color: var(--ink-2); font-weight: 600; }
.alias:empty { display: none; }
.spec.text .alt, .mogul-box .alt { border: 0; background: none; padding: 0; font: inherit; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.mogul-box { margin: 18px 0 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--muted-bg); }
.mogul-box h3 { margin: 0 0 6px; }
.mogul-box .dl-note { margin-bottom: 10px; }
.mogul-box .lic-fields a { overflow-wrap: anywhere; }
.empty { color: var(--ink-3); padding-top: 40px; padding-bottom: 72px; text-align: center; }

/* Phone mode: no installed-font scan on phones, so lead with the library */
#introFile { display: none; }
.phone #scanBtn, .phone #introScan { display: none; }
.phone #introFile { display: inline-flex; }
.phone [data-i18n-html="intro2"] { display: none; }

/* Per-weight downloads, support dialog */
.dl-note { color: var(--ink-3); font-size: 13px; margin: 0 0 12px; max-width: 72ch; }
.dl-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.dl-list a { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 600; text-decoration: none; }
.dl-list a:hover { border-color: var(--ink-3); }
.dl-list a::after { content: "\2193"; color: var(--ink-3); }
#supportDlg { width: min(760px, calc(100vw - 32px)); }
.sup-rows { display: grid; grid-template-columns: max-content 1fr auto; gap: 8px 16px; align-items: center; margin: 18px 0; }
.sup-rows dt { color: var(--ink-3); font-size: 13px; }
.sup-rows dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.sup-qr { display: block; width: min(240px, 100%); border-radius: 12px; border: 1px solid var(--line); margin: 6px 0 16px; background: #fff; }
.foot .link + .link { margin-left: 14px; }

/* Support button, at the end of the footer */
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: 14px 32px; flex-wrap: wrap; }
.donate-btn { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px 0 14px; border: 1px solid var(--line-2);
  border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 700; transition: border-color .15s ease, transform .15s ease; }
.donate-btn span:first-child { color: #e5484d; font-size: 15px; line-height: 1; }
.donate-btn:hover { border-color: var(--ink-3); transform: translateY(-1px); }

/* Footer */
.foot p { text-shadow: 0 0 4px var(--bg), 0 0 10px var(--bg), 0 0 18px var(--bg); }
.foot { color: var(--ink-3); font-size: 13px; padding-top: 20px; padding-bottom: 40px; border-top: 1px solid var(--line); }
.foot p { margin: 0; max-width: 90ch; }

/* Detail dialog */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink); width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 80px rgb(0 0 0 / .3); }
dialog::backdrop { background: rgb(10 10 12 / .5); }
.d-in { padding: 22px clamp(16px, 3vw, 32px) 32px; }
.d-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.d-head h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.d-actions { display: flex; gap: 6px; align-items: center; flex: none; flex-wrap: wrap; }
.icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn:hover { border-color: var(--ink-3); }
.d-spec { font-size: clamp(40px, 7vw, 88px); line-height: 1.12; overflow-wrap: anywhere; padding: 14px 0 22px; border-bottom: 1px solid var(--line); }
.axes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 28px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.axis { display: grid; grid-template-columns: 7.5em 1fr 3.5em; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.axis input { accent-color: var(--ink); width: 100%; }
.axis output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 24px 0 10px; font-weight: 600; }
.lic-box { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 4px; }
.lic-box summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 0; font-size: 14px; font-weight: 600; }
.lic-box summary::-webkit-details-marker { display: none; }
.lic-box summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
.lic-box[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
.lic-box .lic-sum { color: var(--ink-3); font-weight: 500; }
.lic-box > div { padding-bottom: 6px; }
.lic-box .lic-guide { margin: 10px 0 0; font-size: 13px; }
.info-btn { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: none; color: var(--ink-3); font: italic 700 12px/1 Georgia, serif; padding: 0; display: grid; place-items: center; }
.info-btn:hover { color: var(--ink); border-color: var(--ink); }
.lic-verdict { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; }
.lic-verdict p { margin: 0; color: var(--ink); }
.lic-fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
.lic-fields dt { color: var(--ink-3); }
.lic-fields dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.lic-note { color: var(--ink-3); font-size: 12px; margin: 10px 0 0; }
.abc { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.cell { aspect-ratio: 1; display: grid; place-items: center; font-size: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
.cell.bad-cell { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.cell.bad-cell::after { content: ""; position: absolute; inset: 8px; opacity: .55; background: linear-gradient(to top right, transparent calc(50% - 1px), var(--bad) calc(50% - 1px), var(--bad) calc(50% + 1px), transparent calc(50% + 1px)); }
.styles { list-style: none; margin: 0; padding: 0; }
.styles li { display: grid; grid-template-columns: 170px 150px 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.st-name { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.st-status { font-size: 12px; color: var(--ink-3); }
.st-status.ok { color: var(--ok); }
.st-status.warn { color: var(--warn); }
.st-status.bad { color: var(--bad); }
.st-spec { font-size: 28px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Overlays */
.bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 40; }
.bar span { display: block; height: 100%; width: 100%; background: var(--ok); transform: scaleX(0); transform-origin: left; transition: transform .2s; }
.drop { position: fixed; inset: 12px; z-index: 50; border: 2px dashed var(--ink); border-radius: 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-items: center; font-size: 22px; font-weight: 600; pointer-events: none; text-align: center; padding: 24px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  .wrap { padding-inline: 16px; }
  .nav { flex-wrap: wrap; gap: 10px 12px; padding-top: 12px; }
  .top-actions { order: 2; }
  .tabs { order: 3; flex: 1 1 100%; margin-inline: -4px; }
  .tab { height: 44px; }
  .seg, .presets { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .seg::-webkit-scrollbar, .presets::-webkit-scrollbar { display: none; }
  .seg button, .presets button { flex: none; }
  .search { flex: 1 1 100%; width: auto; margin-left: 0; }
  .range input { width: 100px; }
  .tab { padding: 0 10px; font-size: 13px; }
  .styles li { grid-template-columns: 1fr auto; }
  .st-spec { grid-column: 1 / -1; }
  .d-head { flex-direction: column; }
  .lic-fields { grid-template-columns: 1fr; }
  .lic-fields dd { margin-bottom: 6px; }
}
</style>

// Reads a font file's character map (cmap) directly, so the answer is what the
// font file contains, not what the browser happens to render with fallbacks.
const MN_LETTERS = (() => {
  const a = [];
  for (let c = 0x410; c <= 0x44F; c++) a.push(c);      // А–Я а–я
  a.push(0x401, 0x451, 0x4E8, 0x4E9, 0x4AE, 0x4AF);    // Ё ё Ө ө Ү ү
  return a;

function tag4(dv, o) {

function faceOffsets(dv) {

function tableDir(dv, off) {

function nameStr(dv, t, id) {

    if (pid === 1 && !fallback) {

function makeLookup(dv, fmt) {
  if (fmt === 12) {
    const n = dv.getUint32(12);

      }
      return false;
    };
  }

  const segX2 = dv.getUint16(6), seg = segX2 / 2;

  return cp => {
    if (cp > 0xFFFF || seg === 0) return false;
    let lo = 0, hi = seg - 1;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (dv.getUint16(endO + 2 * m) < cp) lo = m + 1; else hi = m;
    }
    if (dv.getUint16(endO + 2 * lo) < cp) return false;
    const start = dv.getUint16(startO + 2 * lo);
    if (cp < start) return false;
    const delta = dv.getUint16(deltaO + 2 * lo), ro = dv.getUint16(rangeO + 2 * lo);

    const pos = rangeO + 2 * lo + ro + 2 * (cp - start);

    const g = dv.getUint16(pos);

function cmapLookup(dv, t) {
  const c = t.cmap;
  if (!c) return null;
  const n = dv.getUint16(c.off + 2);
  let best = -1, bestScore = -1;
  for (let i = 0; i < n; i++) {
    const r = c.off + 4 + 8 * i;
    const pid = dv.getUint16(r), eid = dv.getUint16(r + 2), so = c.off + dv.getUint32(r + 4);
    if (so + 4 > dv.byteLength) continue;
    const fmt = dv.getUint16(so);
    let score = -1;
    if (fmt === 12 && ((pid === 3 && eid === 10) || pid === 0)) score = 3;
    else if (fmt === 4 && ((pid === 3 && eid === 1) || pid === 0)) score = 2;
    else if (fmt === 4 && pid === 3 && eid === 0) score = 1;   // symbol fonts
    if (score > bestScore) { bestScore = score; best = so; }
  }
  if (best < 0) return null;
  const fmt = dv.getUint16(best);
  const declared = fmt === 12 ? dv.getUint32(best + 4) : dv.getUint16(best + 2);
  const end = Math.min(dv.byteLength, Math.max(c.off + c.len, best + declared));
  if (end <= best) return null;
  // Copy just this subtable so the (possibly huge) font buffer can be freed.
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset + best, end - best).slice();
  const look = makeLookup(new DataView(bytes.buffer), fmt);
  return cp => { try { return look(cp); } catch { return false; } };
}

function axesOf(dv, t) {
  const f = t.fvar;
  if (!f) return [];
  const b = f.off, ao = b + dv.getUint16(b + 4), n = dv.getUint16(b + 8), sz = dv.getUint16(b + 10), out = [];
  for (let i = 0; i < n; i++) {
    const r = ao + i * sz;
    out.push({
      tag: tag4(dv, r),
      min: dv.getInt32(r + 4) / 65536,
      def: dv.getInt32(r + 8) / 65536,
      max: dv.getInt32(r + 12) / 65536,
      hidden: (dv.getUint16(r + 16) & 1) === 1,
    });
  }
  return out;
}

function classify(has) {
  const missing = MN_LETTERS.filter(c => !has(c));
  const basicMissing = missing.some(c => c >= 0x410 && c <= 0x44F);
  return {
    status: missing.length === 0 ? "mn" : basicMissing ? "none" : "ru",
    missing,
    tugrik: has(0x20AE),
    bichig: BICHIG.every(has),
  };
}

function analyze(buf, wantPs) {
  const dv = new DataView(buf);
  const offs = faceOffsets(dv);
  let t = null;
  if (offs.length > 1 && wantPs) {
    for (const o of offs) {
      const tt = tableDir(dv, o);
      if (nameStr(dv, tt, 6) === wantPs) { t = tt; break; }
    }
  }
  if (!t) t = tableDir(dv, offs[0]);
  const os2 = t["OS/2"];
  const info = {
    ps: nameStr(dv, t, 6),
    fullName: nameStr(dv, t, 4),
    nameFamily: nameStr(dv, t, 16) || nameStr(dv, t, 1),
    nameStyle: nameStr(dv, t, 17) || nameStr(dv, t, 2),
    axes: axesOf(dv, t),
    copyright: nameStr(dv, t, 0),
    trademark: nameStr(dv, t, 7),
    manufacturer: nameStr(dv, t, 8),
    designer: nameStr(dv, t, 9),
    license: nameStr(dv, t, 13),
    licenseUrl: nameStr(dv, t, 14),
    fsType: os2 && os2.len >= 10 ? dv.getUint16(os2.off + 8) : 0,
  };
  const has = cmapLookup(dv, t);
  if (!has) return { ...info, has: null, status: "unknown", missing: [], tugrik: false, bichig: false };

    guideHtml: `<h2>Фонтоо зар сурталчилгаанд хууль ёсоор ашиглах</h2>
<p class="lead">Фонт бол программ шиг лицензтэй бүтээл. Үнэгүй татаж авсан ч зар сурталчилгаанд ашиглаж болно гэсэн үг биш.</p>
<p class="legend"><span class="lg"><span class="lic-dot ok"></span> Нээлттэй лиценз</span> <span class="lg"><span class="lic-dot ok ring"></span> Windows-той ирдэг</span> <span class="lg"><span class="lic-dot warn"></span> Лиценз хэрэгтэй</span> <span class="lg"><span class="lic-dot bad"></span> Зөвхөн хувийн / Demo</span> <span class="lg"><span class="lic-dot"></span> Тодорхойгүй</span><br><small>Фонтын карт дээрх жижиг цэг ийм утгатай. Хулганаа дээр нь аваачвал тайлбар гарна.</small></p>
<div class="rules">
<article class="rule ok"><h3><span>✓</span> Нээлттэй лицензтэй фонт</h3><p><b>OFL, Apache, Ubuntu Font Licence, DejaVu.</b> Зар сурталчилгаа, лого, хэвлэл, видео, вэб, апп, бүгдэд үнэгүй. Фонтын файлыг дангаар нь зарж болохгүй. Бусдад дамжуулбал лицензийн файлыг хамт өгнө. <button type="button" class="link" data-go="lib">Фонтын сангийн</button> «Үнэгүй» хэсгийн бүх фонт ийм.</p></article>
<article class="rule ok"><h3><span>✓</span> Windows-той хамт ирдэг фонт</h3><p>Зар сурталчилгаа, лого, постер, хэвлэмэл бүтээгдэхүүн, видеонд ашиглаж болно. Харин фонтын файлыг бусдад өгөх, вэб сайтад байршуулах, апп-д оруулахыг хориглоно. Office-ийн «Home &amp; Student» зэрэг арилжааны бус хувилбараар хийсэн ажилд энэ эрх хамаарахгүй.</p></article>
<article class="rule info"><h3><span>✓</span> Төлбөртэй фонт</h3><p>Лицензийн төрлөө шалгаарай: компьютерт (хэвлэл, зураг), вэбэд, апп-д тус тусад нь зардаг. Хэдэн хүн, хэдэн компьютерт ашиглахыг ч лицензэд заадаг.</p></article>
<article class="rule bad"><h3><span>✗</span> «Personal use», «Demo», «Trial» фонт</h3><p>Зөвхөн хувийн хэрэглээнд. Зар сурталчилгаа, лого, захиалгат ажилд ашиглаж болохгүй. Үнэгүй фонтын сайтуудаас татсан гоё фонтуудын ихэнх нь ийм байдаг.</p></article>
<article class="rule bad"><h3><span>✗</span> Олон зуун фонттой багц, архив</h3><p>500, 1000 гаруй фонттой архив, Google Drive-ын багц, файл зардаг сайтаас авсан фонтууд ихэвчлэн лицензгүй. Архивыг мөнгөөр худалдаж авсан ч фонтын лиценз авсан гэсэн үг биш.</p></article>
<article class="rule bad"><h3><span>✗</span> Нэрийг нь сольсон хуулбар</h3><p>Arial, Times New Roman зэрэг фонтод Монгол үсэг нэмж, нэрийг нь сольсон хуулбарыг ашиглах эрхгүй. Microsoft нь Windows-ын фонтыг өөрчлөхийг зөвшөөрдөггүй. Mogul багцын фонтууд ч мөн ийм хуулбар.</p></article>
<article class="rule bad"><h3><span>✗</span> Хуучин кодчиллын фонт</h3><p>Юникодоос өмнөх зарим фонт Ө, Ү-г өөр тэмдэгтийн оронд суулгасан байдаг. Ийм фонтоор бичсэн текст өөр фонт руу шилжихэд эвдэрнэ. MonFont ийм фонтыг «Үсэг дутуу» эсвэл «Кирилл үсэггүй» гэж харуулна.</p></article>

<h3 class="sub-h">Өөрийн фонтуудаа шалгах</h3>
<p><button type="button" class="link" data-go="mine">Миний фонтууд</button> хэсэг фонт бүрийн файлд бичигдсэн лицензийн мэдээллийг уншаад «Зар сурталчилгаанд болно», «Лиценз хэрэгтэй», «Зөвхөн хувийн», «Тодорхойгүй» гэж ангилна. Энэ нь зөвхөн файлд бичигдсэн мэдээлэл тул эргэлзвэл фонтыг татсан сайтаас нь лицензийг шалгаарай.</p>

let aliasN = 0;

// ---------- scanning ----------
async function analyzeFace(face) {
  if (face.result) return face.result;
  const blob = await face.fd.blob();
  face.result = analyze(await blob.arrayBuffer(), face.ps);
  return face.result;
}

function licenseFor(f) {
  if (isMogulName(f.name)) return { kind: "rights", mogul: true, owner: "Mogul" };   // a renamed copy; see mogul.json
  const r = f.rep && f.rep.result ? f.rep.result : f;
  return licenseOf(r, [f.name, r.nameFamily, r.fullName, r.ps, f.fileName, ...(f.faces || []).map(x => x.full)], r.nameFamily || f.name);
}

// Why can't we scan? Not a secure page, an old Chromium, or a browser without the feature.
function scanBlocker() {
  if ("queryLocalFonts" in window) return "";
  if (!window.isSecureContext) return "insecure";
  if (/(Chrome|Chromium|Edg|OPR)\/\d+/.test(navigator.userAgent) && !/Mobile|Android/i.test(navigator.userAgent)) return "update";
  return "unsupported";
}

function showNote(kind, err) {
  state.note = kind;
  state.noteErr = err;
  const n = $("#note");
  n.textContent = kind === "unsupported" ? t("noteUnsupported") : kind === "insecure" ? t("noteInsecure") : kind === "update" ? t("noteUpdate")

}

function setProgress(done, total) {
  const bar = $("#bar");
  bar.hidden = done >= total;
  bar.firstElementChild.style.transform = `scaleX(${total ? done / total : 0})`;
  if (done < total) $("#status").textContent = t("scanning", done, total);
}

async function scanInstalled() {
  if (state.scanning) return;
  if (!("queryLocalFonts" in window)) { showNote(scanBlocker()); setView("mine"); return; }
  let list;
  try { list = await window.queryLocalFonts(); }
  catch (e) { showNote(e && (e.name === "SecurityError" || e.name === "NotAllowedError") ? "denied" : "error", e); setView("mine"); return; }
  if (!list.length) { showNote("denied"); setView("mine"); return; }

  state.note = null;
  $("#note").hidden = true;
  for (const b of $$("#scanBtn, #introScan, #shScan")) b.disabled = true;

  for (const fd of list) {
    let f = byFam.get(fd.family);
    if (!f) byFam.set(fd.family, f = { key: fd.family, name: fd.family, source: "installed", faces: [], status: "pending" });
    f.faces.push({ ps: fd.postscriptName, full: fd.fullName, style: fd.style, fd });
  }

  for (const f of fams) { f.faces.sort((a, b) => styleRank(a.style) - styleRank(b.style)); f.rep = pickRep(f.faces); }

  let done = 0;
  setProgress(0, fams.length);
  await pool(fams, 4, async f => {
    try { Object.assign(f, await analyzeFace(f.rep)); }
    catch { Object.assign(f, { status: "unknown", missing: [], has: null, axes: [] }); }

  const realName = f => (f.status !== "unknown" && f.nameFamily) || f.name;
  fams.sort((a, b) => (realName(a) === a.name ? 0 : 1) - (realName(b) === b.name ? 0 : 1));

// A family can pass in Regular and break in another style (Arial Narrow has no Ө/Ү).
// Check every remaining style in the background and flag those families.
async function checkAllStyles(fams) {

  show();
  await pool(jobs, 4, async face => {
    try { await analyzeFace(face); } catch { /* unreadable style */ }
    state.styleCheck.done++;
    if (state.styleCheck.done % 10 === 0) show();
  });
  for (const f of multi) {

  render();
}

async function addFiles(fileList) {
  const files = [...fileList];
  const ok = files.filter(f => /\.(ttf|otf|ttc)$/i.test(f.name));
  if (!ok.length) { toast(t("onlyFonts")); return; }
  let added = 0;
  for (const file of ok) {
    try {
      const buf = await file.arrayBuffer();
      const r = analyze(buf, null);
      let css = null;
      try {
        const alias = "mnfffile" + (++aliasN);
        const ff = new FontFace(alias, buf);
        await ff.load();
        document.fonts.add(ff);
        css = alias;
      } catch { /* preview unavailable */ }
      const style = r.nameStyle && !/^regular$/i.test(r.nameStyle) ? " " + r.nameStyle : "";
      const fam = {
        ...r, key: "file:" + file.name, name: (r.nameFamily || file.name.replace(/\.[^.]+$/, "")) + style,
        source: "file", fileName: file.name, css,
        faces: [{ ps: r.ps, style: r.nameStyle || "Regular", full: r.fullName, result: r, css }],
      };
      fam.rep = fam.faces[0];
      fam.licInfo = licenseFor(fam);
      state.families = state.families.filter(f => f.key !== fam.key);
      state.families.push(fam);
      added++;
    } catch { toast(t("cantRead", file.name)); }
  }

// The "Mogul" pack (kok.mn, 2010) is other people's fonts, renamed with a few letters added. mogul.json
// (built by tools/build_mogul.py) says what each one really is. Row: [name without "Mogul ", real name ("" = not
// found), designer, maker, licence c/w/u/fc/fp/o, official URL, original has Ө/Ү y/n/u, free look-alike, confidence h/m/l,
// short real name, short maker]
const MOGUL = { rows: null, byKey: new Map(), alts: new Map(), p: null };
const mogulKey = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "");
const isMogulName = n => /^mogul\s/i.test(n || "");
function loadMogul() {
  return MOGUL.p || (MOGUL.p = fetch("mogul.json")
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(d => {
      MOGUL.rows = d.rows;
      for (const r of d.rows) {
        MOGUL.byKey.set(mogulKey(r[0]), r);
        if (r[7]) { const k = r[7].toLowerCase(); if (!MOGUL.alts.has(k)) MOGUL.alts.set(k, []); MOGUL.alts.get(k).push(r[0]); }
      }
      for (const f of state.families) if (isMogulName(f.name)) f.el = null;   // rebuild with the real name
      for (const e of LIB) if (MOGUL.alts.has(e.family.toLowerCase())) e.el = null;
      render();

// "Mogul Academy Bold" → the "Academy" row
function mogulFor(name) {
  if (!MOGUL.rows || !isMogulName(name)) return null;
  let s = name.replace(/^mogul\s+/i, "");
  for (;;) {
    const r = MOGUL.byKey.get(mogulKey(s));
    if (r) return r;
    const shorter = s.replace(/\s+(regular|normal|book|roman|italic|oblique|bold|light|medium|black|heavy)$/i, "");
    if (shorter === s) return null;
    s = shorter;

// Library entries a Mogul search should also find: "kudri" → Old Standard TT (replaces Mogul Kudriashov)
function mogulAltsMatching(e, q) {
  const names = MOGUL.alts.get(e.family.toLowerCase());
  if (!names || !q) return [];
  const qq = q.replace(/^mogul\s*/, "");
  return qq ? names.filter(n => ("mogul " + n).toLowerCase().includes(q) || n.toLowerCase().includes(qq)) : names;
}
function mogulMatches(q) {
  if (!MOGUL.rows || q.length < 3) return [];
  const qq = q.replace(/^mogul\s*/, "");
  if (!qq && !/^mog/.test(q)) return [];
  return MOGUL.rows.filter(r => !qq || ("mogul " + r[0]).toLowerCase().includes(q) || r[0].toLowerCase().includes(qq));
}

const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const r = cardRef.get(e.target);
    if (r && r.kind === "lib") loadLibFont(r.e);
    io.unobserve(e.target);
  }
}, { rootMargin: "350px 0px" });

// Google Fonts previews: one stylesheet request per 8 families, and only the letters the sample text
// needs (text=...), which is ~9 KB per family instead of ~80 KB. New letters are added later, per family.
const gfChars = new Set();   // letters the previews cover so far
const gfLoaded = [];         // families that already asked for fonts
const gfQueue = [];
let gfTimer = 0;
const gfCssPromise = e => e.cssP || (e.cssP = new Promise(res => { e.cssRes = res; }));
function gfSingle(e) {      // fallback: the whole family, if the subset request fails
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=" + e.q + "&display=swap";
  l.onload = l.onerror = () => e.cssRes();
  document.head.append(l);
}
function gfRequest(entries, text, first) {
  const per = text.length > 60 ? 4 : 8;
  for (let i = 0; i < entries.length; i += per) {
    const batch = entries.slice(i, i + per);
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?" + batch.map(e => "family=" + e.q).join("&") + "&text=" + encodeURIComponent(text) + "&display=swap";
    l.onload = () => batch.forEach(e => e.cssRes());
    l.onerror = () => { if (first) batch.forEach(gfSingle); };   // one bad family shouldn't sink the batch
    document.head.append(l);
  }
}
function gfNeed(text) {   // make sure the previews can draw these letters
  const fresh = [...new Set(text + " ")].filter(ch => !gfChars.has(ch) && !/[\u0000-\u001f]/.test(ch));
  if (!fresh.length) return;
  for (const ch of fresh) gfChars.add(ch);
  if (gfLoaded.length) gfRequest(gfLoaded.slice(), fresh.join(""), false);
}
function flushGf() {
  gfTimer = 0;
  const entries = gfQueue.splice(0);
  gfLoaded.push(...entries);
  gfRequest(entries, [...gfChars].join(""), true);
}
function loadLibFont(e) {
  if (e.loaded) return;
  e.loaded = true;
  if (e.preview !== "gf") return;
  gfCssPromise(e);
  gfNeed(sampleText());
  gfQueue.push(e);
  if (!gfTimer) gfTimer = setTimeout(flushGf, 30);
}

// Resolves once the card's real font has downloaded (or after a few seconds, so a failure never hides text).
function fontReady(e) {
  if (e.ready) return e.ready;
  const load = css => document.fonts.load(`48px ${css}`, sampleText());
  let p;
  if (e.preview === "gf") p = gfCssPromise(e).then(() => load(libSpec(e).css));
  else if (e.preview === "url") p = load(libSpec(e).css);
  else p = Promise.resolve();
  e.ready = Promise.race([p.catch(() => {}), new Promise(r => setTimeout(r, 6000))]);
  return e.ready;
}

function libSpec(e) {
  if (e.preview === "gf") return { css: cssStr(e.family), has: cp => cp !== 0x20AE || e.tug };
  if (e.preview === "url") {
    const w = e.axes.find(a => a.tag === "wght");
    e.alias = e.alias || addFace(e.pv ? `url(${cssStr(e.pv)}) format("woff2")` : `url(${cssStr(e.ttf)}) format("truetype")`, w ? `font-weight:${w.min} ${w.max}` : "");
    return { css: e.alias, has: cp => cp !== 0x20AE || e.tug };
  }
  if (e.preview === "local") return hasLocalFont(e.family) ? { css: cssStr(e.family), has: cp => cp !== 0x20AE || e.tug } : { css: null, naText: t("notInstalledPreview") };
  return { css: null };
}

// ---------- views ----------
function setView(v) {

function updateTabs(mnCount) {
  for (const b of $$("#tabs .tab")) b.setAttribute("aria-selected", String(b.dataset.tab === state.view));

const licMatch = (f, l) => l === "all" || (f.licInfo && (l === "ads" ? (f.licInfo.kind === "free" || f.licInfo.kind === "windows") : f.licInfo.kind === l));

function localVisible(f, ignore) {
  if (f.status === "pending") return false;
  if (state.q && !f.name.toLowerCase().includes(state.q)) return false;
  if (ignore !== "status" && state.filter !== "all" && f.status !== state.filter) return false;
  if (ignore !== "lic" && !licMatch(f, state.lic)) return false;
  if (state.tugrik && !f.tugrik) return false;
  if (state.variable && !(f.axes || []).some(a => !a.hidden)) return false;
  return true;
}

function libVisible(e, ignore) {
  if (ignore !== "kind" && e.kind !== state.kind) return false;
  if (e.kind === "paid") return !state.q || e.family.toLowerCase().includes(state.q);
  if (ignore !== "cat" && state.cat !== "all" && e.cat !== state.cat) return false;
  if (state.q && !e.family.toLowerCase().includes(state.q) && !mogulAltsMatching(e, state.q).length) return false;
  if (state.tugrik && !e.tug) return false;
  if (state.variable && !e.axes.length) return false;
  if (state.hideInstalled && state.scanned && (e.kind === "free" || e.kind === "mn") && state.installed.has(e.family.toLowerCase())) return false;
  return true;
}

function render() {
  clearTimeout(renderT); renderT = 0;
  const v = state.view;
  for (const el of $$("[data-views]")) el.hidden = !el.dataset.views.split(" ").includes(v);
  if (!state.scanned || state.kind !== "free") $("#hideInstLabel").hidden = true;
  if (v === "lib" && (state.kind === "paid" || state.kind === "mogul")) for (const el of $$("#catSeg, #filterRow .chk")) el.hidden = true;

  const ready = state.families.filter(f => f.status !== "pending");
  const counts = { mn: 0, ru: 0, none: 0, all: 0 };
  for (const f of ready) { counts.all++; if (f.status in counts) counts[f.status]++; }
  updateTabs(counts.mn);

  const hasLocal = state.scanned || state.scanning || state.families.length > 0;
  $("#intro").hidden = v !== "mine" || hasLocal;
  $("#filterRow").hidden = v === "mine" && !hasLocal;

  let cards = [], status = "", empty = t("empty");
  if (v === "mine") {
    for (const b of $("#seg").children) b.querySelector("b").textContent = ready.filter(f => (b.dataset.f === "all" || f.status === b.dataset.f) && localVisible(f, "status")).length;
    for (const b of $("#licSeg").children) b.querySelector("b").textContent = ready.filter(f => licMatch(f, b.dataset.l) && localVisible(f, "lic")).length;
    const list = state.families.filter(f => localVisible(f)).sort((a, b) =>
      (a.source === "file" ? 0 : 1) - (b.source === "file" ? 0 : 1) || a.name.localeCompare(b.name));
    cards = list.map(f => f.el || (f.el = buildLocalCard(f)));
    status = hasLocal && !state.scanning ? t("status", counts.all, counts.mn, list.length) : "";
    if (!hasLocal) empty = "";
  } else if (v === "lib") {
    for (const b of $("#kindSeg").children) {
      const bb = b.querySelector("b");
      if (bb) bb.textContent = b.dataset.k === "mogul" ? (MOGUL.rows ? mogulTabRows().length : "") : LIB.filter(e => e.kind === b.dataset.k && libVisible(e, "kind")).length;
    }
    for (const b of $("#catSeg").children) {
      const c = b.dataset.c;
      const n = LIB.filter(e => (c === "all" || e.cat === c) && libVisible(e, "cat")).length;
      b.querySelector("b").textContent = n;
      b.hidden = n === 0 && c !== "all" && state.cat !== c;
    }
    const list = state.kind === "mogul" ? [] : LIB.filter(e => libVisible(e));
    cards = list.map(e => e.el || (e.el = buildLibCard(e)));
    for (const e of list) {   // "Replaces: Mogul Kudriashov" when a Mogul search found this font
      const a = $(".alias", e.el);
      if (!a) continue;
      const m = state.q && !e.family.toLowerCase().includes(state.q) ? mogulAltsMatching(e, state.q) : [];
      a.textContent = m.length ? t("mogulInstead") + " " + m.map(n => "Mogul " + n).join(", ") : "";
    }
    if (state.kind === "paid") cards.push(buildSubmitCard());

let cur = null;
const WEIGHT_NAMES = { 100: "Thin", 200: "ExtraLight", 300: "Light", 400: "Regular", 500: "Medium", 600: "SemiBold", 700: "Bold", 800: "ExtraBold", 900: "Black" };
const styleLabel = (w, italic) => (w === 400 && italic ? "Italic" : (WEIGHT_NAMES[w] || String(w)) + (italic ? " Italic" : ""));

// css2 query for every style of a Google Font, with full variable-axis ranges.
function gfDetailQuery(e) {
  const name = e.q.split(":")[0];
  const ups = e.styles.filter(s => !s.endsWith("i")).map(Number);
  const its = e.styles.filter(s => s.endsWith("i")).map(s => +s.slice(0, -1));
  if (e.axes.length) {
    const axes = e.axes.map(a => ({ tag: a.tag, val: a.min === a.max ? String(a.min) : `${a.min}..${a.max}` }));
    if (its.length) axes.push({ tag: "ital" });
    // Google wants the axes alphabetical, lowercase tags before uppercase ones.
    const lower = tag => tag === tag.toLowerCase();
    axes.sort((a, b) => lower(a.tag) !== lower(b.tag) ? (lower(a.tag) ? -1 : 1) : a.tag < b.tag ? -1 : a.tag > b.tag ? 1 : 0);
    const tuple = ital => axes.map(a => a.tag === "ital" ? ital : a.val).join(",");
    return `${name}:${axes.map(a => a.tag).join(",")}@${its.length ? `${tuple(0)};${tuple(1)}` : tuple()}`;
  }
  if (!its.length) return ups.length > 1 ? `${name}:wght@${ups.join(";")}` : e.q;
  return `${name}:ital,wght@${[...ups.map(w => `0,${w}`), ...its.map(w => `1,${w}`)].join(";")}`;
}

// Load the full family under a private name, so its axes and weights don't clash
// with the single-style copy the card already loaded.
function detailFontCss(e) {
  if (e.detailCss) return e.detailCss;
  const alias = "mnffd" + (++aliasN);
  e.detailCss = `${alias}, ${cssStr(e.family)}`;
  fetch("https://fonts.googleapis.com/css2?family=" + gfDetailQuery(e) + "&display=swap")
    .then(r => r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status)))
    .then(css => {
      if (!/@font-face/.test(css)) throw new Error("no @font-face");
      const s = document.createElement("style");
      s.textContent = css.replace(/font-family:\s*'[^']*'/g, `font-family: '${alias}'`);
      document.head.append(s);
    })
    .catch(() => loadLibFont(e));
  return e.detailCss;
}

function openLibDetail(e) {
  // Fonts we can only preview from this computer: show the real installed copy if we have it.
  const local = state.families.find(f => f.source === "installed" && f.status !== "pending" && f.name.toLowerCase() === e.family.toLowerCase());
  if (local && e.preview === "local") { openDetail(local); return; }
  const has = cp => cp !== 0x20AE || e.tug;
  const result = { status: "mn", missing: [], has };
  let css, styles;
  if (e.preview === "gf") {
    css = detailFontCss(e);
    styles = e.styles.map(s => [+s.replace("i", ""), s.endsWith("i")]);
  } else {
    css = libSpec(e).css;
    const w = e.axes.find(a => a.tag === "wght");
    styles = w ? [100, 200, 300, 400, 500, 600, 700, 800, 900].filter(x => x >= w.min && x <= w.max).map(x => [x, false])
      : e.preview === "url" ? [[400, false]] : [[400, false], [400, true], [700, false], [700, true]];
  }
  openDetail({
    name: e.family, source: "lib", status: "mn", missing: [], has, css, tugrik: e.tug, bichig: false,
    axes: e.axes.filter(a => a.max > a.min),
    faces: styles.map(([w, it]) => ({ style: styleLabel(w, it), css, weight: w, italic: it, result })),
    licInfo: e.kind === "windows" ? { kind: "windows" } : { kind: "free", name: e.lic },
    mnZip: e.kind === "mn" ? e.zip : null,
    libLicense: e.kind === "windows"
      ? { license: "Microsoft Windows", licenseUrl: MS_FAQ, source: e.url }
      : e.kind === "mn"
      ? { designer: `${e.designers} · ${t("mnAdditions")}`, license: e.lic, licenseUrl: LICENSE_URLS[e.lic], source: MN_REPO }
      : { designer: e.designers, license: e.lic, licenseUrl: LICENSE_URLS[e.lic], source: e.url },
  });
}

function fillLicense(box, f) {
  box.replaceChildren();
  const li = f.licInfo || { kind: "unknown" };
  const r = (f.rep && f.rep.result) || f;
  const v = document.createElement("div");
  v.className = "lic-verdict";
  const bx = document.createElement("div");
  licenseBadge(bx, li);
  const p = document.createElement("p");
  p.textContent = li.kind === "free" ? (li.name === "author" ? t("vAuthor") : t("vFree", li.name))
    : li.kind === "windows" ? t("vWin") : li.kind === "rights" ? (li.mogul ? t("vMogul", (mogulFor(f.name) || [])[1]) : li.renamedFrom ? t("vRenamed", li.renamedFrom, li.owner, WINDOWS_LIB.some(w => w[0] === li.renamedFrom)) : t("vRights", li.owner))
    : li.kind === "personal" ? t("vPersonal") : t("vUnknown");
  v.append(bx, p);
  const dl = document.createElement("dl");
  dl.className = "lic-fields";
  const row = (label, value, isUrl) => {
    if (!value) return;
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = label;
    if (isUrl && /^https?:\/\//i.test(value)) {
      const a = document.createElement("a");
      a.href = value; a.target = "_blank"; a.rel = "noopener noreferrer nofollow"; a.textContent = value;
      dd.append(a);
    } else dd.textContent = value.length > 400 ? value.slice(0, 400) + "…" : value;
    dl.append(dt, dd);
  };
  if (f.libLicense) {
    const L = f.libLicense;
    row(t("fDesigner"), L.designer);
    row(t("fLicense"), L.license);
    row(t("fLicenseUrl"), L.licenseUrl, true);
    row(t("fSource"), L.source, true);
  } else {
    row(t("fCopyright"), r.copyright);
    row(t("fManufacturer"), r.manufacturer);
    row(t("fDesigner"), r.designer);
    row(t("fLicense"), r.license);
    row(t("fLicenseUrl"), r.licenseUrl, true);
    const fs = r.fsType || 0;
    row(t("fEmbed"), fs & 8 ? t("fs8") : fs & 4 ? t("fs4") : fs & 2 ? t("fs2") : t("fs0"));
  }
  const note = document.createElement("p");
  note.className = "lic-note";
  note.textContent = t(f.licNoteKey || (f.libLicense ? "libLicNote" : "licNote"));
  const g = document.createElement("p");
  g.className = "lic-guide";
  const gb = document.createElement("button");
  gb.type = "button"; gb.className = "link"; gb.dataset.go = "guide"; gb.textContent = t("licGuideLink");
  g.append(gb);
  box.append(v, dl, note, g);
}

function openDetail(f) {
  cur = f;
  const text = sampleText();
  $("#dTitle").textContent = f.name;
  fillBadges($("#dBadges"), f, true);
  setStar($("#dStar"), f.name);

  const spec = $("#dSpec"), abc = $("#dAbc");
  spec.style.fontVariationSettings = "";
  abc.style.fontVariationSettings = "";
  fillSpec(spec, f, text);

  const axesBox = $("#dAxes");
  axesBox.replaceChildren();
  const vis = (f.axes || []).filter(a => !a.hidden && a.max > a.min);
  axesBox.hidden = !vis.length || !f.css;
  const vals = {};
  const fmt = v => (Math.abs(v) >= 10 ? Math.round(v) : Math.round(v * 10) / 10).toString();
  for (const a of vis) {
    vals[a.tag] = a.def;
    const lab = document.createElement("label");
    lab.className = "axis";
    const nm = document.createElement("span");
    nm.textContent = axisName(a.tag);
    const r = document.createElement("input");
    r.type = "range"; r.min = a.min; r.max = a.max; r.step = a.max - a.min >= 20 ? 1 : 0.1; r.value = a.def;
    const out = document.createElement("output");
    out.textContent = fmt(a.def);
    r.addEventListener("input", () => {
      vals[a.tag] = +r.value;
      out.textContent = fmt(+r.value);
      const v = Object.entries(vals).map(([k, x]) => `"${k}" ${x}`).join(", ");
      spec.style.fontVariationSettings = v;
      abc.style.fontVariationSettings = v;
    });
    lab.append(nm, r, out);
    axesBox.append(lab);
  }

  fillLicense($("#dLic"), f);
  fillMogul(f);
  fillFiles(f);
  const lt = licText(f.licInfo || { kind: "unknown" });
  $("#dLicSum").textContent = lt[0];
  $("#dLicDot").replaceChildren(licDot(f.licInfo));
  $("#dLicBox").open = false;

  abc.style.fontFamily = f.css || "";
  abc.replaceChildren(...ABC.map(ch => {
    const c = document.createElement("div");
    c.className = "cell";
    c.textContent = ch;
    if (f.has && !f.has(ch.codePointAt(0))) { c.classList.add("bad-cell"); c.title = t("cellMiss", ch); }
    return c;
  }));

  const ul = $("#dStyles");
  ul.replaceChildren();
  for (const face of f.faces) {
    const li = document.createElement("li");
    const nm = document.createElement("span"); nm.className = "st-name"; nm.textContent = face.style || face.ps;
    const st = document.createElement("span"); st.className = "st-status"; st.textContent = t("checking");
    const sp = document.createElement("div"); sp.className = "st-spec";
    li.append(nm, st, sp);
    ul.append(li);
    face.li = { st, sp };
  }
  $("#detail").showModal();

  pool(f.faces, 3, async face => {
    let r = null;
    try { r = face.result || (face.fd ? await analyzeFace(face) : null); } catch { r = null; }
    if (cur !== f || !face.li) return;
    const { st, sp } = face.li;
    if (!r) { st.textContent = t("unreadable"); return; }
    if (r.status === "mn") { st.textContent = t("stOk"); st.className = "st-status ok"; }
    else if (r.status === "ru") { st.textContent = t("missing", chars(r.missing)); st.className = "st-status warn"; }
    else if (r.status === "none") { st.textContent = t("noCyr"); st.className = "st-status bad"; }
    else st.textContent = t("unreadable");
    if (!face.css && f.source !== "lib") face.css = f.source === "file" ? f.css : localAlias(face.ps, f.name);
    fillSpec(sp, { css: face.css, has: r.has }, sampleText());
    if (face.weight) { sp.style.fontWeight = face.weight; sp.style.fontStyle = face.italic ? "italic" : "normal"; }
  });
}

  else if (e.target.closest(".name") || (e.target.closest(".spec") && ref.f.css)) openDetail(ref.f);
});

const dlg = $("#detail");
$("#dClose").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { if (cur) for (const face of cur.faces) face.li = null; cur = null; });
$("#dStar").addEventListener("click", () => cur && toggleStar(cur.name));
$("#dMogul").addEventListener("click", e => { const a = e.target.closest(".alt"); if (a) openAlt(a.dataset.alt); });
$("#dCopy").addEventListener("click", () => cur && copyText(cur.name, t("copiedName", cur.name)));
$("#dCss").addEventListener("click", () => cur && copyText(`font-family: ${cssStr(cur.name)};`, t("copiedCss")));

// ---- Support ----
const supportDlg = $("#supportDlg");
const donateOn = !!(DONATE.account || DONATE.iban || DONATE.qr);
$("#supportLink").hidden = !donateOn;
$("#supportLink").addEventListener("click", () => {
  const rows = $("#sRows");
  rows.replaceChildren();
  const add = (label, value, copy) => {
    if (value && typeof value === "object") value = value[state.lang] || value.mn;
    if (!value) return;
    const dt = document.createElement("dt"), dd = document.createElement("dd"), act = document.createElement("dd");
    dt.textContent = label; dd.textContent = value;
    if (copy) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn small"; b.textContent = t("supportCopy");
      b.addEventListener("click", () => copyText(value.replace(/\s+/g, ""), t("supportCopied")));
      act.append(b);
    }
    rows.append(dt, dd, act);
  };
  add(t("supportBank"), DONATE.bank);
  add(t("supportHolder"), DONATE.holder);
  add(t("supportAccount"), DONATE.account, true);
  add("IBAN", DONATE.iban, true);
  add(t("supportNote"), DONATE.note, true);
  const qr = $("#sQr");
  qr.hidden = !DONATE.qr;
  if (DONATE.qr) qr.src = DONATE.qr;
  supportDlg.showModal();
});
$("#sClose").addEventListener("click", () => supportDlg.close());
supportDlg.addEventListener("click", e => { if (e.target === supportDlg) supportDlg.close(); });

// Phones: the intro button picks font files
$("#introFile").addEventListener("click", () => $("#fileInput").click());

// Drag and drop font files anywhere
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("#drop").hidden = false; });
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#drop").hidden = true; } });
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $("#drop").hidden = true;
  addFiles(e.dataTransfer.files);
});

// ---------- start ----------
state.shared = readShared();
if (state.shared) state.view = "shared";
else if (location.hash === "#library" || PHONE) state.view = "lib";
applyLang();
loadMogul();
if (location.hash === "#guide") openGuide();
(async () => {
  if (!("queryLocalFonts" in window)) { if (!PHONE) showNote(scanBlocker()); return; }
  try {
    const p = await navigator.permissions.query({ name: "local-fonts" });
    if (p.state === "granted") scanInstalled();
    else if (p.state === "denied") showNote("denied");
  } catch { /* permission query unsupported: wait for the button */ }
})();
</script>
</body>
</html>
