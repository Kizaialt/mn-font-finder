<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --surface: #ffffff;
  --surface-2: #faf9f6;
  --ink: #141416;
  --ink-2: #4d4d55;
  --ink-3: #7c7c86;
  --line: #e3e1da;
  --line-2: #d2cfc6;
  --muted-bg: #edece7;
  --ok: #17714a;
  --ok-bg: #e2f2e9;
  --warn: #9a5200;
  --warn-bg: #fcefdc;
  --bad: #b0262c;
  --bad-bg: #f9e3e2;
  --star: #d99a00;
  --accent: #141416;
  --accent-ink: #ffffff;
  --focus: #2f5bea;
  --spec-size: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113;
    --surface: #1a1a1d;
    --surface-2: #202024;
    --ink: #f1f0ec;
    --ink-2: #b4b3ad;
    --ink-3: #85847f;
    --line: #2b2b30;
    --line-2: #3b3b41;
    --muted-bg: #26262a;
    --ok: #5cd193;
    --ok-bg: #163526;
    --warn: #f0a94b;
    --warn-bg: #3a2a12;
    --bad: #f37d81;
    --bad-bg: #3d1b1d;
    --star: #f2b630;
    --accent: #f1f0ec;
    --accent-ink: #111113;
    --focus: #7d9bff;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1480px; margin-inline: auto; padding-inline: 24px; }

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px 32px; flex-wrap: wrap; padding-top: 32px; padding-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; }
.brand svg { flex: none; }
h1 { font-size: clamp(28px, 3.6vw, 42px); line-height: 1.05; letter-spacing: -0.02em; margin: 0; font-weight: 700; }
.sub { margin: 0; color: var(--ink-2); max-width: 60ch; }
.sub strong { color: var(--ink); font-weight: 600; }
.top-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lang { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 999px; }
.lang button { border: 0; background: transparent; height: 32px; min-width: 38px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--ink-3); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
  font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; text-decoration: none;
  transition: border-color .15s, background .15s, opacity .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { opacity: .88; }
.btn.small { height: 34px; padding: 0 14px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: progress; }

/* Toolbar */
.toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
@media (max-height: 760px), (max-width: 640px) { .toolbar { position: static; } }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; height: 44px; padding: 0 14px; font-weight: 600; font-size: 14px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab b { font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.tab .star-ic { color: var(--star); margin-right: 4px; }
.tb { padding-top: 12px; padding-bottom: 10px; display: grid; gap: 10px; }
.tb-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sample { flex: 1 1 360px; min-width: 0; height: 46px; padding: 0 16px; font-size: 19px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-size: 13px; font-weight: 500; }
.presets button:hover { background: var(--surface); border-color: var(--ink-3); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 18px; background: var(--muted-bg); }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg button b { font-weight: 600; margin-left: 5px; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.seg button[aria-pressed="true"] b { color: inherit; }
.search { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); width: 200px; font-size: 14px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.chk input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
.range { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.range input { accent-color: var(--ink); width: 120px; }
.tb-status { display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); min-height: 20px; }
.tb-status .spacer { flex: 1; }
.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; font-weight: 600; }

/* Intro + notes */
.intro { padding-top: 24px; padding-bottom: 48px; }
.intro-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 40px clamp(20px, 5vw, 56px); max-width: 800px; }
.intro-big { font-size: clamp(64px, 11vw, 128px); line-height: 1.2; margin: 0 0 16px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink) !important; }
.intro-card p { color: var(--ink-2); margin: 0 0 12px; max-width: 62ch; }
.intro-card strong { color: var(--ink); }
.intro-card .btn { margin: 8px 0 20px; }
.privacy { display: flex; gap: 8px; align-items: flex-start; }
.privacy svg { flex: none; margin-top: 3px; color: var(--ok); }
code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .9em; background: var(--muted-bg); padding: 1px 6px; border-radius: 6px; }
.note { margin-top: 20px !important; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn) !important; font-weight: 500; }
.banner { margin-top: 20px; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.banner h2 { font-size: 17px; margin: 0; }
.banner p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Grid + cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; padding-top: 20px; padding-bottom: 56px; }
.grid.list { grid-template-columns: 1fr; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px 12px 16px; display: flex; flex-direction: column; min-width: 0;
  content-visibility: auto; contain-intrinsic-size: auto 220px; transition: border-color .15s;
}
.card:hover { border-color: var(--line-2); }
.card-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name { border: 0; background: none; padding: 0; font-weight: 600; font-size: 14px; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.name:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.star { margin-left: auto; border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.star:hover { background: var(--muted-bg); color: var(--ink); }
.star path { fill: none; }
.star[aria-pressed="true"], .star[aria-pressed="true"]:hover { color: var(--star); }
.star[aria-pressed="true"] path { fill: currentColor; }
.spec {
  font-size: var(--spec-size); line-height: 1.18; margin: 10px 0 14px; flex: 1;
  overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.spec.click { cursor: pointer; }
.grid.list .spec { -webkit-line-clamp: 2; }
.spec.na { font-size: 14px; color: var(--ink-3); }
.ghost .spec { font-size: 15px; line-height: 1.5; color: var(--ink-3); -webkit-line-clamp: unset; }
.miss { color: var(--bad); text-decoration: underline wavy var(--bad); text-decoration-skip-ink: none; text-underline-offset: .15em; text-decoration-thickness: 2px; }
.card-f { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.badge { display: inline-block; height: 22px; line-height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--muted-bg); color: var(--ink-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.have { background: transparent; box-shadow: inset 0 0 0 1px var(--ok); color: var(--ok); }
.copy, .get { border: 0; background: none; font-size: 12px; color: var(--ink-3); padding: 4px 6px; border-radius: 6px; white-space: nowrap; flex: none; text-decoration: none; }
.copy:hover, .get:hover { color: var(--ink); background: var(--muted-bg); }
.get { color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line-2); padding: 4px 9px; }
.empty { color: var(--ink-3); padding-top: 40px; padding-bottom: 72px; text-align: center; }

/* Footer */
.foot { color: var(--ink-3); font-size: 13px; padding-top: 20px; padding-bottom: 40px; border-top: 1px solid var(--line); }
.foot p { margin: 0; max-width: 90ch; }

/* Detail dialog */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink); width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 80px rgb(0 0 0 / .3); }
dialog::backdrop { background: rgb(10 10 12 / .5); }
.d-in { padding: 22px clamp(16px, 3vw, 32px) 32px; }
.d-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.d-head h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.d-actions { display: flex; gap: 6px; align-items: center; flex: none; flex-wrap: wrap; }
.icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn:hover { border-color: var(--ink-3); }
.d-spec { font-size: clamp(40px, 7vw, 88px); line-height: 1.12; overflow-wrap: anywhere; padding: 14px 0 22px; border-bottom: 1px solid var(--line); }
.axes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 28px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.axis { display: grid; grid-template-columns: 7.5em 1fr 3.5em; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.axis input { accent-color: var(--ink); width: 100%; }
.axis output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 24px 0 10px; font-weight: 600; }
.abc { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.cell { aspect-ratio: 1; display: grid; place-items: center; font-size: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
.cell.bad-cell { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.cell.bad-cell::after { content: ""; position: absolute; inset: 8px; opacity: .55; background: linear-gradient(to top right, transparent calc(50% - 1px), var(--bad) calc(50% - 1px), var(--bad) calc(50% + 1px), transparent calc(50% + 1px)); }
.styles { list-style: none; margin: 0; padding: 0; }
.styles li { display: grid; grid-template-columns: 170px 150px 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.st-name { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.st-status { font-size: 12px; color: var(--ink-3); }
.st-status.ok { color: var(--ok); }
.st-status.warn { color: var(--warn); }
.st-status.bad { color: var(--bad); }
.st-spec { font-size: 28px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Overlays */
.bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 40; }
.bar span { display: block; height: 100%; width: 100%; background: var(--ok); transform: scaleX(0); transform-origin: left; transition: transform .2s; }
.drop { position: fixed; inset: 12px; z-index: 50; border: 2px dashed var(--ink); border-radius: 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-items: center; font-size: 22px; font-weight: 600; pointer-events: none; text-align: center; padding: 24px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  .wrap { padding-inline: 16px; }
  .top { padding-top: 22px; }
  .search { flex: 1 1 100%; width: auto; }
  .range input { width: 100px; }
  .tab { padding: 0 10px; font-size: 13px; }
  .styles li { grid-template-columns: 1fr auto; }
  .st-spec { grid-column: 1 / -1; }
  .d-head { flex-direction: column; }
}
</style>
</head>
<body>
<div id="bar" class="bar" hidden><span></span></div>

<header class="top wrap">
  <div>
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="currentColor"/><ellipse cx="32" cy="32" rx="15" ry="19" fill="none" stroke="var(--bg)" stroke-width="6"/><path d="M17 32h30" stroke="var(--bg)" stroke-width="6"/></svg>
      <h1 data-i18n="brand">Фонт Шүүгч</h1>
    </div>
    <p class="sub" data-i18n-html="tagline"></p>
  </div>
  <div class="top-actions">
    <div class="lang" id="langSw" role="group" aria-label="Language / Хэл">
      <button type="button" data-lang="mn" aria-pressed="true">МН</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <label class="btn" for="fileInput" tabindex="0" id="fileBtn" data-i18n="checkFiles"></label>
    <input id="fileInput" type="file" multiple accept=".ttf,.otf,.ttc" hidden>
    <button id="scanBtn" class="btn primary" type="button"></button>
  </div>
</header>

<div id="toolbar" class="toolbar">
  <div class="wrap">
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-tab="mine"><span data-i18n="tabMine"></span><b id="cMine"></b></button>
      <button class="tab" role="tab" type="button" data-tab="free"><span data-i18n="tabFree"></span><b id="cFree"></b></button>
      <button class="tab" role="tab" type="button" data-tab="short"><span class="star-ic" aria-hidden="true">★</span><span data-i18n="tabShort"></span><b id="cShort"></b></button>
      <button class="tab" role="tab" type="button" data-tab="shared" hidden><span data-i18n="tabShared"></span><b id="cShared"></b></button>
    </nav>
    <div class="tb">
      <div class="tb-row">
        <input id="sample" class="sample" type="text" spellcheck="false" data-i18n-aria="sampleAria">
        <div class="presets" role="group">
          <button type="button" data-preset="sentence" data-i18n="presetSentence"></button>
          <button type="button" data-preset="caps" data-i18n="presetCaps"></button>
          <button type="button" data-preset="abc" data-i18n="presetAbc"></button>
          <button type="button" data-preset="num">0–9 ₮</button>
        </div>
        <label class="range"><span data-i18n="size"></span> <input id="size" type="range" min="16" max="140" step="2" data-i18n-aria="size"></label>
      </div>
      <div class="tb-row" id="filterRow">
        <div class="seg" id="seg" role="group" data-views="mine">
          <button type="button" data-f="mn" data-i18n-title="segMnT"><span data-i18n="segMn"></span><b></b></button>
          <button type="button" data-f="ru" data-i18n-title="segRuT"><span data-i18n="segRu"></span><b></b></button>
          <button type="button" data-f="none" data-i18n-title="segNoneT"><span data-i18n="segNone"></span><b></b></button>
          <button type="button" data-f="all"><span data-i18n="segAll"></span><b></b></button>
        </div>
        <div class="seg" id="catSeg" role="group" data-views="free">
          <button type="button" data-c="all"><span data-i18n="catAll"></span><b></b></button>
          <button type="button" data-c="S"><span data-i18n="catS"></span><b></b></button>
          <button type="button" data-c="R"><span data-i18n="catR"></span><b></b></button>
          <button type="button" data-c="D"><span data-i18n="catD"></span><b></b></button>
          <button type="button" data-c="H"><span data-i18n="catH"></span><b></b></button>
          <button type="button" data-c="M"><span data-i18n="catM"></span><b></b></button>
        </div>
        <input id="search" class="search" type="search" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
        <label class="chk" data-views="mine free"><input id="fTug" type="checkbox"> <span data-i18n="hasTug"></span></label>
        <label class="chk" data-views="mine free"><input id="fVar" type="checkbox"> <span data-i18n="variable"></span></label>
        <label class="chk" id="hideInstLabel" data-views="free"><input id="fHide" type="checkbox"> <span data-i18n="hideInstalled"></span></label>
      </div>
      <div class="tb-status">
        <span id="status" aria-live="polite"></span>
        <span class="spacer"></span>
        <button id="copyNames" class="link" type="button" data-views="short" data-i18n="copyNames"></button>
        <button id="copyLink" class="link" type="button" data-views="short" data-i18n="copyLink"></button>
      </div>
    </div>
  </div>
</div>

<section id="sharedBanner" class="wrap" data-views="shared">
  <div class="banner">
    <div>
      <h2 id="shTitle"></h2>
      <p id="shSub"></p>
    </div>
    <div class="acts">
      <button id="shScan" class="btn small primary" type="button" data-i18n="scan"></button>

// ==PARSER START==
// Reads a font file's character map (cmap) directly, so the answer is what the
// font file contains, not what the browser happens to render with fallbacks.
const MN_LETTERS = (() => {
  const a = [];
  for (let c = 0x410; c <= 0x44F; c++) a.push(c);      // А–Я а–я
  a.push(0x401, 0x451, 0x4E8, 0x4E9, 0x4AE, 0x4AF);    // Ё ё Ө ө Ү ү
  return a;
})();
const BICHIG = [0x1820, 0x1821, 0x1822, 0x1823, 0x1824, 0x182D, 0x182F, 0x1830];

function tag4(dv, o) {
  return String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
}

function faceOffsets(dv) {
  const t = tag4(dv, 0);
  if (t === "wOFF" || t === "wOF2") throw new Error("WOFF files are not supported");
  if (t !== "ttcf") return [0];
  const n = dv.getUint32(8), out = [];
  for (let i = 0; i < n; i++) out.push(dv.getUint32(12 + 4 * i));
  return out;
}

function tableDir(dv, off) {
  const n = dv.getUint16(off + 4), t = {};
  for (let i = 0; i < n; i++) {
    const r = off + 12 + 16 * i;
    t[tag4(dv, r)] = { off: dv.getUint32(r + 8), len: dv.getUint32(r + 12) };
  }
  return t;
}

function nameStr(dv, t, id) {
  const nm = t.name;

    const r = b + 6 + 12 * i;

    const pid = dv.getUint16(r), lang = dv.getUint16(r + 4), len = dv.getUint16(r + 8), o = strOff + dv.getUint16(r + 10);
    if (o + len > dv.byteLength) continue;

      if (pid === 3 && lang !== 0x409) { if (!fallback) fallback = s; continue; }
      return s;
    }
    if (pid === 1 && !fallback) {
      let s = "";
      for (let k = 0; k < len; k++) s += String.fromCharCode(dv.getUint8(o + k));

    }

function makeLookup(dv, fmt) {

      }

    if (cp > 0xFFFF || seg === 0) return false;
    let lo = 0, hi = seg - 1;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (dv.getUint16(endO + 2 * m) < cp) lo = m + 1; else hi = m;
    }
    if (dv.getUint16(endO + 2 * lo) < cp) return false;
    const start = dv.getUint16(startO + 2 * lo);
    if (cp < start) return false;
    const delta = dv.getUint16(deltaO + 2 * lo), ro = dv.getUint16(rangeO + 2 * lo);

    const pos = rangeO + 2 * lo + ro + 2 * (cp - start);
    if (pos + 2 > dv.byteLength) return false;
    const g = dv.getUint16(pos);
    return g !== 0 && ((g + delta) & 0xFFFF) !== 0;
  };
}

function cmapLookup(dv, t) {
  const c = t.cmap;
  if (!c) return null;
  const n = dv.getUint16(c.off + 2);
  let best = -1, bestScore = -1;
  for (let i = 0; i < n; i++) {
    const r = c.off + 4 + 8 * i;
    const pid = dv.getUint16(r), eid = dv.getUint16(r + 2), so = c.off + dv.getUint32(r + 4);
    if (so + 4 > dv.byteLength) continue;
    const fmt = dv.getUint16(so);
    let score = -1;
    if (fmt === 12 && ((pid === 3 && eid === 10) || pid === 0)) score = 3;
    else if (fmt === 4 && ((pid === 3 && eid === 1) || pid === 0)) score = 2;
    else if (fmt === 4 && pid === 3 && eid === 0) score = 1;   // symbol fonts
    if (score > bestScore) { bestScore = score; best = so; }
  }
  if (best < 0) return null;
  const fmt = dv.getUint16(best);
  const declared = fmt === 12 ? dv.getUint32(best + 4) : dv.getUint16(best + 2);
  const end = Math.min(dv.byteLength, Math.max(c.off + c.len, best + declared));
  if (end <= best) return null;
  // Copy just this subtable so the (possibly huge) font buffer can be freed.
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset + best, end - best).slice();
  const look = makeLookup(new DataView(bytes.buffer), fmt);
  return cp => { try { return look(cp); } catch { return false; } };
}

function axesOf(dv, t) {
  const f = t.fvar;
  if (!f) return [];
  const b = f.off, ao = b + dv.getUint16(b + 4), n = dv.getUint16(b + 8), sz = dv.getUint16(b + 10), out = [];

      tag: tag4(dv, r),
      min: dv.getInt32(r + 4) / 65536,
      def: dv.getInt32(r + 8) / 65536,
      max: dv.getInt32(r + 12) / 65536,
      hidden: (dv.getUint16(r + 16) & 1) === 1,
    });
  }
  return out;
}

function classify(has) {
  const missing = MN_LETTERS.filter(c => !has(c));
  const basicMissing = missing.some(c => c >= 0x410 && c <= 0x44F);
  return {
    status: missing.length === 0 ? "mn" : basicMissing ? "none" : "ru",
    missing,
    tugrik: has(0x20AE),
    bichig: BICHIG.every(has),
  };
}

function analyze(buf, wantPs) {
  const dv = new DataView(buf);
  const offs = faceOffsets(dv);
  let t = null;
  if (offs.length > 1 && wantPs) {
    for (const o of offs) {
      const tt = tableDir(dv, o);
      if (nameStr(dv, tt, 6) === wantPs) { t = tt; break; }
    }
  }
  if (!t) t = tableDir(dv, offs[0]);
  const info = {
    ps: nameStr(dv, t, 6),
    nameFamily: nameStr(dv, t, 16) || nameStr(dv, t, 1),
    nameStyle: nameStr(dv, t, 17) || nameStr(dv, t, 2),
    axes: axesOf(dv, t),
  };
  const has = cmapLookup(dv, t);
  if (!has) return { ...info, has: null, status: "unknown", missing: [], tugrik: false, bichig: false };
  return { ...info, has, ...classify(has) };
}

async function analyzeFace(face) {
  if (face.result) return face.result;
  const blob = await face.fd.blob();
  face.result = analyze(await blob.arrayBuffer(), face.ps);
  return face.result;
}

  n.hidden = false;
}

function setProgress(done, total) {
  const bar = $("#bar");
  bar.hidden = done >= total;
  bar.firstElementChild.style.transform = `scaleX(${total ? done / total : 0})`;
  if (done < total) $("#status").textContent = t("scanning", done, total);
}

async function scanInstalled() {
  if (state.scanning) return;
  if (!("queryLocalFonts" in window)) { showNote("unsupported"); setView("mine"); return; }
  let list;
  try { list = await window.queryLocalFonts(); }
  catch (e) { showNote(e && (e.name === "SecurityError" || e.name === "NotAllowedError") ? "denied" : "error", e); setView("mine"); return; }
  if (!list.length) { showNote("denied"); setView("mine"); return; }

  state.scanning = true;
  state.note = null;
  $("#note").hidden = true;
  for (const b of $$("#scanBtn, #introScan, #shScan")) b.disabled = true;
  const byFam = new Map();
  for (const fd of list) {
    let f = byFam.get(fd.family);
    if (!f) byFam.set(fd.family, f = { key: fd.family, name: fd.family, source: "installed", faces: [], status: "pending" });
    f.faces.push({ ps: fd.postscriptName, full: fd.fullName, style: fd.style, fd });
  }
  const fams = [...byFam.values()];
  for (const f of fams) { f.faces.sort((a, b) => styleRank(a.style) - styleRank(b.style)); f.rep = pickRep(f.faces); }
  state.families = state.families.filter(f => f.source === "file").concat(fams);
  render();

  let done = 0;
  setProgress(0, fams.length);
  await pool(fams, 4, async f => {
    try { Object.assign(f, await analyzeFace(f.rep)); }
    catch { Object.assign(f, { status: "unknown", missing: [], has: null, axes: [] }); }
    f.css = localAlias(f.rep.ps, f.name);
    setProgress(++done, fams.length);
    scheduleRender();
  });

  // Windows lists each named instance of a variable font as its own family
  // ("Climate Crisis 1990", "Climate Crisis 2000", …). Fold them back together
  // using the family name stored in the font file itself.
  const realName = f => (f.status !== "unknown" && f.nameFamily) || f.name;
  fams.sort((a, b) => (realName(a) === a.name ? 0 : 1) - (realName(b) === b.name ? 0 : 1));
  const merged = new Map();
  for (const f of fams) {
    const k = realName(f), m = merged.get(k);
    if (!m) {
      if (k !== f.name) { f.name = f.key = k; f.el = null; }
      merged.set(k, f);
    } else {
      m.faces.push(...f.faces);
      m.faces.sort((a, b) => styleRank(a.style) - styleRank(b.style));
      m.el = null;
    }
  }
  state.families = state.families.filter(f => f.source === "file").concat([...merged.values()]);
  state.installed = new Set([...merged.values()].map(f => f.name.toLowerCase()));
  for (const g of GALLERY) if (g.el) fillFreeBadges($(".badges", g.el), g);

  state.scanning = false;
  state.scanned = true;
  for (const b of $$("#scanBtn, #introScan, #shScan")) b.disabled = false;
  $("#scanBtn").textContent = t("rescan");
  render();
}

  for (const file of ok) {
    try {
      const buf = await file.arrayBuffer();
      const r = analyze(buf, null);
      const alias = "mnfffile" + (++aliasN);
      let css = null;
      try { const ff = new FontFace(alias, buf); await ff.load(); document.fonts.add(ff); css = alias; } catch { /* preview unavailable */ }
      const style = r.nameStyle && !/^regular$/i.test(r.nameStyle) ? " " + r.nameStyle : "";
      const fam = {
        ...r, key: "file:" + file.name, name: (r.nameFamily || file.name.replace(/\.[^.]+$/, "")) + style,
        source: "file", fileName: file.name, css,
        faces: [{ ps: r.ps, style: r.nameStyle || "Regular", result: r, css }],
      };
      fam.rep = fam.faces[0];
      state.families = state.families.filter(f => f.key !== fam.key);
      state.families.push(fam);
      added++;
    } catch { toast(t("cantRead", file.name)); }
  }
  if (ok.length < files.length) toast(t("skipped"));
  else if (added) toast(t("addedFiles", added));
  if (added) { setFilter("all"); setView("mine"); window.scrollTo({ top: 0, behavior: "smooth" }); }
}

// ---------- cards ----------
function fillSpec(el, f, text) {
  el.replaceChildren();
  el.classList.toggle("na", !f.css);
  if (!f.css) { el.textContent = t("previewNA"); el.style.fontFamily = ""; return; }
  el.style.fontFamily = f.css;
  let run = "";
  const flush = () => { if (run) { el.append(run); run = ""; } };
  for (const ch of text) {
    if (f.has && !/\s/.test(ch) && !f.has(ch.codePointAt(0))) {
      flush();
      const m = document.createElement("span");
      m.className = "miss";
      m.title = t("missSpan");
      m.textContent = ch;
      el.append(m);
    } else run += ch;
  }
  flush();
}

function fillBadges(box, f) {
  box.replaceChildren();
  if (f.status === "mn") badge(box, t("ok"), "ok", t("okT"));
  else if (f.status === "ru") badge(box, t("missing", chars(f.missing)), "warn", t("missingT"));
  else if (f.status === "none") badge(box, t("noCyr"), "bad");
  else badge(box, t("unreadable"));
  if (f.tugrik) badge(box, "₮", "", t("tugT"));
  const ax = (f.axes || []).filter(a => !a.hidden);
  if (ax.length) badge(box, "Variable · " + ax.map(a => a.tag).join(" "), "", t("varT"));
  if (f.bichig) badge(box, t("bichig"), "", t("bichigT"));
  if (f.source === "file") badge(box, t("file", f.fileName), "", t("fileT"));
}

function fillFreeBadges(box, g) {
  box.replaceChildren();
  badge(box, t("ok"), "ok", t("okT"));
  if (g.tug) badge(box, "₮", "", t("tugT"));
  if (g.axes.length) badge(box, "Variable · " + g.axes.join(" "), "");
  if (state.installed.has(g.family.toLowerCase())) badge(box, t("installed"), "have", t("installedT"));
}

function setStar(btn, name) {
  const on = state.shortlist.has(name);
  btn.dataset.name = name;
  btn.innerHTML = STAR;
  btn.setAttribute("aria-pressed", String(on));
  btn.setAttribute("aria-label", on ? t("starRemove", name) : t("starAdd", name));
  btn.title = btn.getAttribute("aria-label");
}

function cardShell(name, metaText) {
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `<div class="card-h"><span class="name"></span><span class="meta"></span><button class="star" type="button"></button></div><div class="spec"></div><div class="card-f"><div class="badges"></div></div>`;
  $(".name", el).textContent = name;
  $(".meta", el).textContent = metaText;
  setStar($(".star", el), name);
  return el;
}

function buildLocalCard(f) {
  const el = cardShell(f.name, f.source === "file" ? "" : t("styles", f.faces.length));
  const nameEl = $(".name", el), btn = document.createElement("button");
  btn.className = "name"; btn.type = "button"; btn.textContent = f.name;
  nameEl.replaceWith(btn);
  const spec = $(".spec", el);
  spec.classList.toggle("click", !!f.css);
  fillSpec(spec, f, sampleText());
  fillBadges($(".badges", el), f);
  const copy = document.createElement("button");
  copy.className = "copy"; copy.type = "button"; copy.textContent = t("copyName");
  $(".card-f", el).append(copy);
  cardRef.set(el, { kind: "local", f });
  return el;
}

const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const r = cardRef.get(e.target);
    if (r && r.kind === "free") loadWebFont(r.g);
    io.unobserve(e.target);
  }
}, { rootMargin: "600px 0px" });

function loadWebFont(g) {
  if (g.loaded) return;
  g.loaded = true;
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=" + g.q + "&display=swap";
  document.head.append(l);
}

function buildFreeCard(g) {
  const el = cardShell(g.family, t(CAT_KEY[g.cat]));
  g.css = cssStr(g.family);
  fillSpec($(".spec", el), { css: g.css, has: cp => cp !== 0x20AE || g.tug }, sampleText());
  fillFreeBadges($(".badges", el), g);
  const a = document.createElement("a");
  a.className = "get";
  a.href = "https://fonts.google.com/specimen/" + g.family.replace(/ /g, "+");
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = t("getFont");
  a.title = t("getFontT");
  $(".card-f", el).append(a);
  cardRef.set(el, { kind: "free", g });
  io.observe(el);
  return el;
}

function buildGhostCard(name) {
  const el = cardShell(name, "");
  el.classList.add("ghost");
  $(".spec", el).textContent = (state.scanned ? t("notHere") + " " : "") + t("notInFree");
  cardRef.set(el, { kind: "ghost", name });
  return el;
}

// A shortlisted or shared name becomes whichever card we can show for it.
function resolveName(name) {
  const lc = name.toLowerCase();
  const f = state.families.find(x => x.status !== "pending" && x.name.toLowerCase() === lc);
  if (f) return f.el || (f.el = buildLocalCard(f));
  const g = GALLERY_BY_NAME.get(lc);
  if (g) return g.el || (g.el = buildFreeCard(g));
  return buildGhostCard(name);
}

// ---------- views ----------
function setView(v) {
  state.view = v;
  render();
}

function updateTabs(mnCount) {
  for (const b of $$("#tabs .tab")) b.setAttribute("aria-selected", String(b.dataset.tab === state.view));
  $("#cMine").textContent = state.scanned || state.families.length ? mnCount : "";
  $("#cFree").textContent = GALLERY.length;
  $("#cShort").textContent = state.shortlist.size || "";
  const sharedTab = $('#tabs [data-tab="shared"]');
  sharedTab.hidden = !state.shared;
  $("#cShared").textContent = state.shared ? state.shared.length : "";
}

function localVisible(f) {
  if (f.status === "pending") return false;
  if (state.q && !f.name.toLowerCase().includes(state.q)) return false;
  if (state.filter !== "all" && f.status !== state.filter) return false;
  if (state.tugrik && !f.tugrik) return false;
  if (state.variable && !(f.axes || []).some(a => !a.hidden)) return false;
  return true;
}

function freeVisible(g, ignoreCat) {
  if (!ignoreCat && state.cat !== "all" && g.cat !== state.cat) return false;
  if (state.q && !g.family.toLowerCase().includes(state.q)) return false;
  if (state.tugrik && !g.tug) return false;
  if (state.variable && !g.axes.length) return false;
  if (state.hideInstalled && state.scanned && state.installed.has(g.family.toLowerCase())) return false;
  return true;
}

function render() {
  clearTimeout(renderT); renderT = 0;
  const v = state.view;
  for (const el of $$("[data-views]")) el.hidden = !el.dataset.views.split(" ").includes(v);
  if (!state.scanned) $("#hideInstLabel").hidden = true;

  const counts = { mn: 0, ru: 0, none: 0, all: 0 };
  for (const f of state.families) {
    if (f.status === "pending") continue;
    counts.all++;
    if (f.status in counts) counts[f.status]++;
  }
  updateTabs(counts.mn);

  const hasLocal = state.scanned || state.scanning || state.families.length > 0;
  $("#intro").hidden = v !== "mine" || hasLocal;
  $("#filterRow").hidden = v === "mine" && !hasLocal;

  let cards = [], status = "", empty = t("empty");
  if (v === "mine") {
    for (const b of $("#seg").children) b.querySelector("b").textContent = counts[b.dataset.f];
    const list = state.families.filter(localVisible).sort((a, b) =>
      (a.source === "file" ? 0 : 1) - (b.source === "file" ? 0 : 1) || a.name.localeCompare(b.name));
    cards = list.map(f => f.el || (f.el = buildLocalCard(f)));
    status = hasLocal && !state.scanning ? t("status", counts.all, counts.mn, list.length) : "";
    if (!hasLocal) empty = "";
  } else if (v === "free") {
    for (const b of $("#catSeg").children) {
      const c = b.dataset.c;
      b.querySelector("b").textContent = GALLERY.filter(g => (c === "all" || g.cat === c) && freeVisible(g, true)).length;
    }
    const list = GALLERY.filter(g => freeVisible(g));
    cards = list.map(g => g.el || (g.el = buildFreeCard(g)));
    status = t("freeStatus", GALLERY.length, state.scanned ? GALLERY.filter(g => state.installed.has(g.family.toLowerCase())).length : null);
  } else {
    const names = (v === "short" ? [...state.shortlist] : state.shared || []).filter(n => !state.q || n.toLowerCase().includes(state.q));
    cards = names.map(resolveName);
    if (v === "short") {
      status = t("shortStatus", state.shortlist.size);
      empty = state.q ? t("emptyQ") : t("emptyShort");
      $("#copyNames").hidden = $("#copyLink").hidden = !state.shortlist.size;
    } else {
      const all = state.shared || [];
      const have = all.filter(n => state.installed.has(n.toLowerCase())).length;
      $("#shTitle").textContent = t("sharedTitle", all.length);
      $("#shSub").textContent = state.scanned ? t("sharedSub", have, all.length - have) : t("sharedScan");
      $("#shScan").hidden = state.scanned || !("queryLocalFonts" in window);
      empty = t("emptyQ");
    }
  }
  if (!state.scanning) $("#status").textContent = status;

  const grid = $("#grid");
  grid.classList.toggle("list", v === "short" || v === "shared");
  grid.replaceChildren(...cards);
  const emptyEl = $("#empty");
  emptyEl.hidden = cards.length > 0 || state.scanning || !empty;
  emptyEl.textContent = empty;
}
let renderT = 0;
function scheduleRender() { if (!renderT) renderT = setTimeout(render, 350); }

function refreshSpecs() {
  const text = sampleText();
  for (const f of state.families) if (f.el) fillSpec($(".spec", f.el), f, text);
  for (const g of GALLERY) if (g.el) fillSpec($(".spec", g.el), { css: g.css, has: cp => cp !== 0x20AE || g.tug }, text);
  if ($("#detail").open && cur) {
    fillSpec($("#dSpec"), cur, text);
    for (const face of cur.faces) if (face.li && face.result) fillSpec(face.li.sp, { css: face.css, has: face.result.has }, text);
  }
}

function setFilter(f) {
  state.filter = f;
  store.set("filter", f);
  for (const b of $("#seg").children) b.setAttribute("aria-pressed", String(b.dataset.f === f));
}
function setCat(c) {
  state.cat = c;
  for (const b of $("#catSeg").children) b.setAttribute("aria-pressed", String(b.dataset.c === c));
}

function toggleStar(name) {
  if (state.shortlist.has(name)) state.shortlist.delete(name); else state.shortlist.add(name);
  store.set("shortlist", [...state.shortlist]);
  for (const b of $$(".star")) if (b.dataset.name === name) setStar(b, name);
  if (state.view === "short") render(); else updateTabs($("#cMine").textContent);
}

function shareLink(names) {
  return location.href.split("#")[0] + "#list=" + encodeURIComponent(names.join("|"));
}
function readShared() {
  const m = location.hash.match(/^#list=(.*)$/);
  if (!m) return null;
  let names;
  try { names = decodeURIComponent(m[1]).split("|"); } catch { return null; }
  names = [...new Set(names.map(s => s.trim().slice(0, 120)).filter(Boolean))].slice(0, 200);
  return names.length ? names : null;
}

// ---------- detail ----------
let cur = null;
function openDetail(f) {
  cur = f;
  const text = sampleText();
  $("#dTitle").textContent = f.name;
  fillBadges($("#dBadges"), f);
  setStar($("#dStar"), f.name);

  const spec = $("#dSpec"), abc = $("#dAbc");
  spec.style.fontVariationSettings = "";
  abc.style.fontVariationSettings = "";
  fillSpec(spec, f, text);

  const axesBox = $("#dAxes");
  axesBox.replaceChildren();
  const vis = (f.axes || []).filter(a => !a.hidden && a.max > a.min);
  axesBox.hidden = !vis.length || !f.css;
  const vals = {};
  const fmt = v => (Math.abs(v) >= 10 ? Math.round(v) : Math.round(v * 10) / 10).toString();
  for (const a of vis) {
    vals[a.tag] = a.def;
    const lab = document.createElement("label");
    lab.className = "axis";
    const nm = document.createElement("span");
    nm.textContent = axisName(a.tag);
    const r = document.createElement("input");
    r.type = "range"; r.min = a.min; r.max = a.max; r.step = a.max - a.min >= 20 ? 1 : 0.1; r.value = a.def;
    const out = document.createElement("output");
    out.textContent = fmt(a.def);
    r.addEventListener("input", () => {
      vals[a.tag] = +r.value;
      out.textContent = fmt(+r.value);
      const v = Object.entries(vals).map(([k, x]) => `"${k}" ${x}`).join(", ");
      spec.style.fontVariationSettings = v;
      abc.style.fontVariationSettings = v;
    });
    lab.append(nm, r, out);
    axesBox.append(lab);
  }

  abc.style.fontFamily = f.css || "";
  abc.replaceChildren(...ABC.map(ch => {
    const c = document.createElement("div");
    c.className = "cell";
    c.textContent = ch;
    if (f.has && !f.has(ch.codePointAt(0))) { c.classList.add("bad-cell"); c.title = t("cellMiss", ch); }
    return c;
  }));

  const ul = $("#dStyles");
  ul.replaceChildren();
  for (const face of f.faces) {
    const li = document.createElement("li");
    const nm = document.createElement("span"); nm.className = "st-name"; nm.textContent = face.style || face.ps;
    const st = document.createElement("span"); st.className = "st-status"; st.textContent = t("checking");
    const sp = document.createElement("div"); sp.className = "st-spec";
    li.append(nm, st, sp);
    ul.append(li);
    face.li = { st, sp };
  }
  $("#detail").showModal();

  pool(f.faces, 3, async face => {
    let r = null;
    try { r = face.result || (face.fd ? await analyzeFace(face) : null); } catch { r = null; }
    if (cur !== f || !face.li) return;
    const { st, sp } = face.li;
    if (!r) { st.textContent = t("unreadable"); return; }
    if (r.status === "mn") { st.textContent = t("stOk"); st.className = "st-status ok"; }
    else if (r.status === "ru") { st.textContent = t("missing", chars(r.missing)); st.className = "st-status warn"; }
    else if (r.status === "none") { st.textContent = t("noCyr"); st.className = "st-status bad"; }
    else st.textContent = t("unreadable");
    if (!face.css) face.css = f.source === "file" ? f.css : localAlias(face.ps, f.name);
    fillSpec(sp, { css: face.css, has: r.has }, sampleText());
  });
}

// ---------- language ----------
function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t("docTitle");
  $('meta[name="description"]').content = t("docDesc", GALLERY.length);
  for (const el of $$("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of $$("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml, GALLERY.length);
  for (const el of $$("[data-i18n-ph]")) el.placeholder = t(el.dataset.i18nPh);
  for (const el of $$("[data-i18n-title]")) el.title = t(el.dataset.i18nTitle);
  for (const el of $$("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  for (const b of $$("#langSw button")) b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
  $("#scanBtn").textContent = t(state.scanned ? "rescan" : "scan");
  if (state.note) showNote(state.note, state.noteErr);
  for (const f of state.families) f.el = null;
  for (const g of GALLERY) g.el = null;
  if ($("#detail").open) $("#detail").close();
  render();
}

// ---------- events ----------
for (const b of $$("#scanBtn, #introScan, #shScan")) b.addEventListener("click", scanInstalled);
$("#fileInput").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("#fileBtn").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#fileInput").click(); } });
$("#langSw").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b || b.dataset.lang === state.lang) return;
  state.lang = b.dataset.lang;
  store.set("lang", state.lang);
  applyLang();
});
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (b) setView(b.dataset.tab);
});
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { setView(go.dataset.go); window.scrollTo({ top: 0, behavior: "smooth" }); }
});

const sampleIn = $("#sample");
sampleIn.value = state.sample;
let sampleT = 0;
sampleIn.addEventListener("input", () => {
  state.sample = sampleIn.value;
  store.set("sample", state.sample);
  clearTimeout(sampleT);
  sampleT = setTimeout(refreshSpecs, 90);
});
document.querySelector(".presets").addEventListener("click", e => {
  const b = e.target.closest("button[data-preset]");
  if (!b) return;
  sampleIn.value = state.sample = PRESETS[b.dataset.preset];
  store.set("sample", state.sample);
  refreshSpecs();
});

const sizeIn = $("#size");
sizeIn.value = state.size;
document.documentElement.style.setProperty("--spec-size", state.size + "px");
sizeIn.addEventListener("input", () => {
  state.size = +sizeIn.value;
  document.documentElement.style.setProperty("--spec-size", state.size + "px");
  store.set("size", state.size);
});

setFilter(state.filter);
setCat("all");
$("#seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]");
  if (b) { setFilter(b.dataset.f); render(); }
});
$("#catSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-c]");
  if (b) { setCat(b.dataset.c); render(); }
});
$("#search").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("#fTug").addEventListener("change", e => { state.tugrik = e.target.checked; render(); });
$("#fVar").addEventListener("change", e => { state.variable = e.target.checked; render(); });
$("#fHide").addEventListener("change", e => { state.hideInstalled = e.target.checked; render(); });
$("#copyNames").addEventListener("click", () => {
  const names = [...state.shortlist];
  copyText(names.join("\n"), t("copiedNames", names.length));
});
$("#copyLink").addEventListener("click", () => copyText(shareLink([...state.shortlist]), t("linkCopied")));
$("#shAdd").addEventListener("click", () => {
  const names = state.shared || [];
  for (const n of names) state.shortlist.add(n);
  store.set("shortlist", [...state.shortlist]);
  for (const b of $$(".star")) if (b.dataset.name) setStar(b, b.dataset.name);
  toast(t("added", names.length));
  render();
});
$("#shClose").addEventListener("click", () => {
  state.shared = null;
  history.replaceState(null, "", location.pathname + location.search);
  setView("mine");
});
window.addEventListener("hashchange", () => {
  const s = readShared();
  if (s) { state.shared = s; setView("shared"); }
});

$("#grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const ref = cardRef.get(card);
  const star = e.target.closest(".star");
  if (star) { toggleStar(star.dataset.name); return; }
  if (!ref || ref.kind !== "local") return;
  if (e.target.closest(".copy")) copyText(ref.f.name, t("copiedName", ref.f.name));
  else if (e.target.closest(".name") || (e.target.closest(".spec") && ref.f.css)) openDetail(ref.f);
});

const dlg = $("#detail");
$("#dClose").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { if (cur) for (const face of cur.faces) face.li = null; cur = null; });
$("#dStar").addEventListener("click", () => cur && toggleStar(cur.name));
$("#dCopy").addEventListener("click", () => cur && copyText(cur.name, t("copiedName", cur.name)));
$("#dCss").addEventListener("click", () => cur && copyText(`font-family: ${cssStr(cur.name)};`, t("copiedCss")));

// Drag and drop font files anywhere
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("#drop").hidden = false; });
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#drop").hidden = true; } });
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $("#drop").hidden = true;
  addFiles(e.dataTransfer.files);
});

// ---------- start ----------
state.shared = readShared();
if (state.shared) state.view = "shared";
applyLang();
(async () => {
  if (!("queryLocalFonts" in window)) { showNote("unsupported"); return; }
  try {
    const p = await navigator.permissions.query({ name: "local-fonts" });
    if (p.state === "granted") scanInstalled();
    else if (p.state === "denied") showNote("denied");
  } catch { /* permission query unsupported: wait for the button */ }
})();
</script>
</body>
</html>
