p { position:absolute; left:94px; top:352px; margin:0; font:600 34px/1.3 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; color:var(--star); }
.url { position:absolute; right:72px; top:96px; font:600 28px/1 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; color:var(--ink-3); }
