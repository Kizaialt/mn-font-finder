:root { --bg:#111113; --ink:#f1f0ec; --ink-3:#85847f; --star:#f2b630; }
* { box-sizing:border-box; }
body { margin:0; width:1200px; height:630px; position:relative; overflow:hidden; color:var(--ink);
  font:400 16px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(900px 420px at 72% -120px, color-mix(in srgb, var(--star) 22%, transparent), transparent 70%) no-repeat, var(--bg); }
.sky { position:absolute; left:0; right:0; bottom:0; height:300px; color:var(--ink); opacity:1;
  -webkit-mask-image:linear-gradient(to top,#000 62%,transparent); mask-image:linear-gradient(to top,#000 62%,transparent); }
.sky svg { display:block; width:100%; height:100%; }
.logo { position:absolute; left:92px; top:84px; display:flex; align-items:center; gap:22px; }
.logo svg { width:104px; height:104px; }
.wm { font:700 54px/1 "Unbounded",system-ui,sans-serif; } .wm i { font-style:normal; color:var(--ink-3); }
h1 { position:absolute; left:92px; top:238px; margin:0; font:700 84px/1.05 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; letter-spacing:-.02em; }
p { position:absolute; left:94px; top:352px; margin:0; font:600 34px/1.3 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; color:var(--star); }
.url { position:absolute; right:72px; top:96px; font:600 28px/1 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; color:var(--ink-3); }
</style>
